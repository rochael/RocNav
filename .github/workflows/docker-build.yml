name: Docker Build & Push

on:
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        type: choice
        options:
          - Production
          - Development
          - Staging
      version_tag:
        description: '版本标签 (例如: v1.0.0)'
        required: false
        type: string
        default: ''
      include_latest:
        description: 'latest标签'
        required: false
        type: boolean
        default: true
  push:
    branches:
      - main
      - master
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: rocnav
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker image
        id: build
        run: |
          VERSION=$(cat VERSION 2>/dev/null || echo dev)
          IMAGE=${REGISTRY}/${{ github.actor }}/${IMAGE_NAME}
          TAGS="$IMAGE:$VERSION"

          if [ -n "${{ inputs.version_tag }}" ]; then
            TAGS="$TAGS,$IMAGE:${{ inputs.version_tag }}"
          fi

          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.include_latest }}" = "true" ]; then
            TAGS="$TAGS,$IMAGE:latest"
          fi

          TAG_ARGS=""
          IFS=',' read -ra TAG_ARRAY <<< "$TAGS"
          for tag in "${TAG_ARRAY[@]}"; do
            TAG_ARGS="$TAG_ARGS -t $tag"
          done

          docker buildx build \
            --platform linux/amd64 \
            --build-arg VERSION=$VERSION \
            $TAG_ARGS \
            --push \
            .

          {
            echo "version=$VERSION"
            echo "image=$IMAGE"
            echo "tags<<EOF"
            for tag in "${TAG_ARRAY[@]}"; do
              echo "$tag"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 输出镜像信息
        run: |
          echo "### Docker镜像构建成功" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**镜像标签：**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.build.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "**版本号：** ${{ steps.build.outputs.version }}" >> $GITHUB_STEP_SUMMARY
